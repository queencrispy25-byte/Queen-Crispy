<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><link rel="manifest" href="manifest.json"><title>Queen Crispy POS</title><style>:root{font-family:system-ui,Tahoma;background:#101010;color:white}body{margin:0;padding:14px;max-width:800px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ffcf00;padding:12px 0}h1{color:#ffcf00;margin:0;font-size:23px}h2{font-size:17px}.tabs{display:flex;gap:7px;overflow:auto;padding:15px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#ffcf00;color:#111}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid #594c13;border-radius:12px;background:#202020;padding:16px 8px;text-align:center;min-height:84px}.product strong{display:block}.price{color:#ffcf00;font-weight:bold;margin-top:9px}button{border:0;border-radius:9px;padding:12px;background:#363636;color:#fff;font-weight:bold;cursor:pointer}.primary{background:#ffcf00;color:#111}.danger{background:#a32727}.cart{background:#1d1d1d;border-radius:12px;padding:14px;margin-top:18px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #333}.line button{padding:7px 11px}.total{font-size:25px;color:#ffcf00;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}input,select{background:#292929;color:#fff;border:1px solid #555;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}#receipt{display:none}small{color:#aaa}#history{margin-top:20px} @media print{body>*:not(#receipt){display:none!important}#receipt{display:block!important;color:black;background:white;font:13px monospace;width:72mm;margin:0 auto;direction:rtl}#receipt h2{text-align:center;font-size:18px}#receipt .line{border-bottom:1px dashed #777}#receipt .total{color:black} @page{size:80mm auto;margin:3mm}}</style></head><body><header><div><h1>👑 Queen Crispy</h1><small>نظام الكاشير — القنيطرة</small></div><span>POS</span></header><div class="tabs" id="tabs"></div><div class="grid" id="products"></div><section class="cart"><h2>🧾 الطلب الحالي <span id="number"></span></h2><div id="lines">اختار المنتجات من الفوق</div><div class="line"><strong>المجموع</strong><span class="total" id="total">0 DH</span></div><div class="actions"><button class="primary" onclick="finish()">تأكيد الطلب وطباعة التيكي</button><button onclick="saveOnly()">حفظ بلا طباعة</button><button class="danger" onclick="clearCart()">مسح</button></div><small>يمكن اختيار حفظ PDF من نافذة الطباعة فـ Android.</small></section><section id="history"><h2>📊 مبيعات اليوم</h2><div id="stats"></div><button onclick="showHistory()">عرض آخر الطلبات</button><div id="orders"></div></section><section id="receipt"></section><script>
const products=[['سندويش نورمال',10,'سندويشات'],['سندويش دجاج',15,'سندويشات'],['سندويش كفتة',17,'سندويشات'],['سندويش كريسبي',20,'سندويشات'],['طاكوس دجاج',23,'طاكوس'],['طاكوس كفتة',26,'طاكوس'],['طاكوس كريسبي',30,'طاكوس'],['برغر دجاج',20,'برغر'],['برغر كفتة',23,'برغر'],['برغر كريسبي',25,'برغر'],['Loaded Fries',22,'أطباق'],['Salad Queen',20,'أطباق'],['صوص ألجيريان',3,'إضافات'],['صوص بيغي',3,'إضافات'],['صوص حار',3,'إضافات'],['صوص جبن',3,'إضافات'],['فريت إضافي',5,'إضافات']];let category='الكل',cart={},orders=JSON.parse(localStorage.getItem('qc_orders')||'[]');function persist(){localStorage.setItem('qc_orders',JSON.stringify(orders))}function orderNumber(){return orders.reduce((m,o)=>Math.max(m,o.id),0)+1}function render(){document.getElementById('number').textContent='#'+orderNumber();document.getElementById('tabs').innerHTML=['الكل','سندويشات','طاكوس','برغر','أطباق','إضافات'].map(c=>`<button class="${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('');document.getElementById('products').innerHTML=products.map((p,i)=>category==='الكل'||p[2]===category?`<button class="product" onclick="add(${i})"><strong>${p[0]}</strong><div class="price">${p[1]} DH +</div></button>`:'').join('');let keys=Object.keys(cart).filter(k=>cart[k]>0);document.getElementById('lines').innerHTML=keys.length?keys.map(k=>`<div class="line"><span>${products[k][0]} × ${cart[k]}</span><span>${products[k][1]*cart[k]} DH <button onclick="add(${k},-1)">−</button><button onclick="add(${k})">+</button></span></div>`).join(''):'اختار المنتجات من الفوق';document.getElementById('total').textContent=total()+' DH';let today=new Date().toLocaleDateString('en-CA');let todayOrders=orders.filter(o=>o.day===today);document.getElementById('stats').textContent=`${todayOrders.length} طلبات — ${todayOrders.reduce((s,o)=>s+o.total,0)} DH`;}function total(){return Object.keys(cart).reduce((s,k)=>s+products[k][1]*cart[k],0)}function add(i,n=1){cart[i]=Math.max(0,(cart[i]||0)+n);render()}function clearCart(){cart={};render()}function createOrder(){if(!total()){alert('الطلب فارغ');return null}let now=new Date();let o={id:orderNumber(),day:now.toLocaleDateString('en-CA'),time:now.toLocaleString('fr-MA'),items:Object.keys(cart).filter(k=>cart[k]>0).map(k=>({name:products[k][0],qty:cart[k],price:products[k][1]})),total:total()};orders.push(o);persist();clearCart();return o}function receipt(o){document.getElementById('receipt').innerHTML=`<h2>👑 QUEEN CRISPY</h2><p style="text-align:center">القنيطرة — اليانس دارنا</p><div>طلب رقم: ${o.id}</div><div>${o.time}</div><hr>${o.items.map(x=>`<div class="line"><span>${x.name} × ${x.qty}</span><span>${x.qty*x.price} DH</span></div>`).join('')}<hr><div class="line total">المجموع: ${o.total} DH</div><p style="text-align:center">شكراً على زيارتكم!</p>`}function finish(){let o=createOrder();if(o){receipt(o);setTimeout(()=>window.print(),120)}}function saveOnly(){let o=createOrder();if(o)alert('تم حفظ الطلب رقم '+o.id)}function showHistory(){document.getElementById('orders').innerHTML=orders.slice(-20).reverse().map(o=>`<div class="line"><span>#${o.id} — ${o.time}</span><span>${o.total} DH <button onclick="reprint(${o.id})">طباعة</button></span></div>`).join('')||'لا توجد طلبات'}function reprint(id){let o=orders.find(x=>x.id===id);if(o){receipt(o);setTimeout(()=>window.print(),100)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
